# Nginx配置 - 飞书机器人反向代理
# 路径: /etc/nginx/sites-available/feishu-bot

server {
    listen 80;
    server_name feishu.epicarena.cn;

    # 日志
    access_log /var/log/nginx/feishu-bot-access.log;
    error_log /var/log/nginx/feishu-bot-error.log;

    # 飞书机器人Webhook
    location /webhook/event {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }

    # Let's Encrypt验证路径（用于SSL证书）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

